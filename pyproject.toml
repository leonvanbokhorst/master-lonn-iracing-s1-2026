[project]
name = "master-lonn-iracing-s1-2026"
version = "0.1.0"
description = "Season logbook tooling for Ray FF1600 Rookie S1 2026."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "seaborn>=0.13.2",
    "scipy>=1.16.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

