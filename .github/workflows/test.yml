name: Tests

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
    
    - name: Set up Python
      run: uv python install 3.13
    
    - name: Install dependencies
      run: |
        uv sync --all-extras --dev
    
    - name: Run SRS tests
      run: |
        uv run pytest tests/test_spaced_repetition.py -v --tb=short
    
    - name: Run all tests
      run: |
        uv run pytest tests/ -v --tb=short
      continue-on-error: true
    
    - name: Generate test summary
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### SRS Test Suite" >> $GITHUB_STEP_SUMMARY
        uv run pytest tests/test_spaced_repetition.py -v --tb=line | tee test_output.txt
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat test_output.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
